name: Bug report
description: Speedy crashes, hangs, gives wrong output, or does not do what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write only what you saw. If you can, also run with `STRATA_UPSTREAM_DEFAULTS=1`: if the bug stays, it may be
        upstream Strata's (say so below).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./update.sh && build/strata serve --config configs/...
        2. ...
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: GPU(s) and VRAM, driver and CUDA version (`nvidia-smi`), CPU, RAM, OS / kernel; gpu-unlock module loaded or not.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Version and configuration
      description: Speedy commit (`git rev-parse --short HEAD`), model pack (e.g. Q2_0, IQ3_S, UD-IQ4_XS), preset or full command line, any STRATA_* variables you set, context size.
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: With STRATA_UPSTREAM_DEFAULTS=1
      options: ["not tried", "the bug stays", "the bug goes away"]
    validations:
      required: true
  - type: textarea
    id: bench
    attributes:
      label: Bench output / logs
      description: The engine's start-up lines (they list the defaults applied) and the relevant log lines, or a `bench/speedbench.py` record.
      render: text
