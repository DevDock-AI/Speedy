name: Feature request
description: A change or new feature for Speedy
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Speedy to do. Link an upstream Strata PR if one exists.
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How it would be measured
      description: Speedy adopts changes after an A/B and the quality gate (CONTRIBUTING.md). Which pack, context and numbers would show it works?
