<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-labelledby="speedy-logo-t speedy-logo-d">
  <title id="speedy-logo-t">Speedy</title>
  <desc id="speedy-logo-d">Original Speedy mascot: a stylised mouse running to the right, with a rocket-flame speed trail. (c) the Speedy contributors, MIT.</desc>
  <defs>
    <linearGradient id="speedy-logo-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#18B6F0"/>
    </linearGradient>
    <linearGradient id="speedy-logo-flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFB000"/>
      <stop offset="0.55" stop-color="#FF6A3D"/>
      <stop offset="1" stop-color="#FF3D7F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="speedy-logo-trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#18B6F0"/>
      <stop offset="1" stop-color="#18B6F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- speed trail -->
  <g stroke-linecap="round" fill="none">
    <path d="M96 84 H28" stroke="url(#speedy-logo-trail)" stroke-width="7"/>
    <path d="M90 150 H40" stroke="url(#speedy-logo-trail)" stroke-width="6"/>
  </g>
  <!-- rocket flame -->
  <path d="M116 104 C92 90 52 102 14 117 C52 132 92 142 116 128 Z" fill="url(#speedy-logo-flame)"/>
  <path d="M116 110 C100 104 78 110 58 117 C78 124 100 128 116 122 Z" fill="#FFE27A" opacity="0.9"/>
  <!-- tail -->
  <path d="M118 128 C96 132 92 156 70 160 C58 162 50 156 46 150" fill="none" stroke="#6A4DF0" stroke-width="5" stroke-linecap="round"/>
  <!-- back leg -->
  <path d="M150 140 L132 160 L114 158" fill="none" stroke="#5B3FD9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ear (behind) -->
  <circle cx="206" cy="70" r="22" fill="url(#speedy-logo-body)"/>
  <circle cx="206" cy="70" r="12" fill="#FF8DBE"/>
  <!-- body + head -->
  <path d="M110 122 C110 88 142 70 180 70 C206 70 226 80 240 92 L272 106 C279 109 279 117 272 120 L240 132 C226 144 204 150 176 150 C138 150 110 146 110 122 Z" fill="url(#speedy-logo-body)"/>
  <!-- belly highlight -->
  <path d="M132 128 C150 140 196 142 226 130 C204 146 150 148 132 128 Z" fill="#FFFFFF" opacity="0.25"/>
  <!-- front leg -->
  <path d="M214 142 L232 162 L248 158" fill="none" stroke="#5B3FD9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="240" cy="100" r="6" fill="#16133A"/>
  <circle cx="242" cy="98" r="2" fill="#FFFFFF"/>
  <!-- nose -->
  <circle cx="275" cy="113" r="5.5" fill="#FF5C9A"/>
  <!-- whiskers -->
  <g stroke="#18B6F0" stroke-width="2.5" stroke-linecap="round">
    <path d="M262 118 L292 124"/>
    <path d="M260 122 L286 134"/>
  </g>
</svg>
